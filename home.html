<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header menu sidebar</title>
    <link rel="stylesheet" href="../style/style-pages/home/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>
    <header id="header">
        <div class="logo">
            <img src="../../resource/image/logo.jpg" alt="Logo Me&Be">
        </div>
        <div class="search-box">
            <input type="text" placeholder="Ba mẹ muốn tìm gì cho bé?">
            <button><i class="fa fa-search"></i></button>
        </div>
        <div class="user-actions">
            <a href="#">Đăng nhập / Đăng ký</a>
            <div class="icons">
                <a href="#"><i class="fa fa-heart"></i><span class="badge">0</span></a>
                <a href="#"><i class="fa fa-shopping-basket"></i><span class="badge">0</span></a>
            </div>
        </div>
    </header>
<!--    thêm sidebar cho trang chủ-->
    <div class="side_part">
        <ul class="sidebar">
            <li class="sidebar_item">Sữa bột cao cấp</li>
            <li class="sidebar_item">Bỉm tã</li>
            <li class="sidebar_item">Sữa tươi các loại</li>
            <li class="sidebar_item">Ăn dặm & dinh dưỡng</li>
            <li class="sidebar_item">Đồ dùng mẹ & bé</li>
        </ul>

    </div>
</body>
</html>
