<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header menu sidebar</title>
    <link rel="stylesheet" href="../style/style-pages/home/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<body>
<header id="header" class>
    <div class="container">
        <div class="headerMain">
            <div class="headerBars">
                <a herf="/bars" data-type="bars">
                    <i class="fas fa-bars"></i>
                </a>
                <div class="headerSearchIcon">
                    <a herf="/search" data-type="search">
                        <i class="fas fa-search"></i>
                    </a>
                </div>

            </div>
            <div class="headerLeft">
                <div class="headerLogo" >
                    <img src="..\..\resource\image\logo.jpg" alt="Me&Be">
                </div>

            </div>
            <div class="headerCenter">
                <div class="headerSearch" style="display: block;">
                    <form action="/search">
                        <div class="headerSearchMain">
                            <input type="hidden" name="type" value="product">
                            <input required="" name="q" maxlength="40" autocomplete="off" class="headerSearchInput " type="text" size="20" placeholder="Ba mẹ muốn tìm gì cho bé?"
                                   aria-label="Search" fdprocessedid="pi3lj">
                        </div>
                        <button type="submit" class="btn-search headerSearchButton" aria-label="Tìm kiếm" fdprocessedid="535ty">
                            <i class="lni lni-search-alt"></i>
                        </button>
                    </form>
                    <div class="headerSearch-Smart">
                        <div class="searchSmart-Result" style="display: none">
                        </div>
                    </div>

                </div>
            </div>
            <div class="headerRight">
                <div class="headerUser">
                    <a href="/account/login">Đăng nhập</a>
                    <span>\</span>
                    <a class="note-click" href="/account/register">Đăng ký</a>
                </div>
                <div class="headerWishlist headerTool">
                    <a href="/account" data-type="wishlist">
                        <i class="lni lni-heart"></i>
                        <span class="headerWishlistCount count">0</span>
                    </a>
                </div>
                <div class="headerCart headerTool">
                    <a href="/cart" data-type="cart">
                        <i class="lni lni-shopping-basket"></i>
                        <span class="headerCartCount count">0</span>
                    </a>
                </div>

            </div>

        </div>

    </div>

</header>
</body>
</html>
